name: Run tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: integration
          persist-credentials: false

      - name: Checkout Home Assistant Core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: home-assistant/core
          ref: ${{ matrix.core }}
          path: core
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

          cache: "pip"

      - name: Install Core test requirements
        working-directory: core
        run: |
          python -m pip install uv
          extra=$(grep -E "^(SQLAlchemy|fnv-hash-fast|psutil-home-assistant|paho-mqtt|aiohasupervisor)==" requirements_all.txt)
          reqs=$(python -c 'import json; print(" ".join(json.load(open("../integration/custom_components/solcast_clearsky/manifest.json"))["requirements"]))')
          # Core dev ships its test helpers as the package pytest_homeassistant. master and rc do not have it yet.
          helpers=""
          if [ -d packages/pytest-home-assistant ]; then
            helpers="-e packages/pytest-home-assistant"
          fi
          # shellcheck disable=SC2086
          uv pip install --system -e . $helpers -r requirements_test.txt $extra $reqs colorlog isodate --config-settings editable_mode=compat

      - name: Mount the integration into Core
        run: |
          rm -rf core/custom_components/solcast_clearsky core/tests/components/solcast_clearsky
          mkdir -p core/custom_components
          cp -a integration/custom_components/solcast_clearsky core/custom_components/solcast_clearsky
          cp -a integration/tests core/tests/components/solcast_clearsky

      - name: Point the test helper imports at Core's package
        run: |
          # Core dev moved tests/common.py and the other test helpers into the package pytest_homeassistant.
          [ -d core/packages/pytest-home-assistant ] || exit 0
          modules="common|typing|ignore_uncaught_exceptions|components\.diagnostics|components\.recorder\.common"
          grep -rlE "from tests\.($modules) import" core/tests/components/solcast_* \
            | xargs -r sed -i -E "s/from tests\.($modules) import/from pytest_homeassistant.\1 import/"

      - name: Run pytest
        run: |
      - name: Compile translations
        working-directory: core
        run: python -m script.translations develop --all

      - name: Run the whole suite with coverage
        working-directory: core
        run: >-
          python -m pytest tests/components/solcast_clearsky
